<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f0ea">
  <meta name="description" content="ganeshv.me">
  <title>ganeshv.me</title>

  <style>
    :root{
      --paper:#f2f0ea;
      --white:#fffef9;
      --ink:#111318;
      --soft:#cfd4db;
      --blue:#2457ff;
      --blue-soft:#dce4ff;
      --cycle:18s;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--paper);
    }

    body{
      min-height:100svh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:
        linear-gradient(rgba(17,19,24,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(17,19,24,.045) 1px,transparent 1px),
        var(--paper);
      background-size:40px 40px;
    }

    .experience{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      isolation:isolate;
    }

    .experience::before{
      content:"";
      position:absolute;
      width:min(78vw,920px);
      aspect-ratio:1;
      border-radius:50%;
      border:1px solid rgba(17,19,24,.08);
      transform:scale(.9);
      animation:breath 9s ease-in-out infinite;
    }

    .experience::after{
      content:"";
      position:absolute;
      width:min(58vw,700px);
      aspect-ratio:1;
      border-radius:50%;
      border:1px dashed rgba(36,87,255,.18);
      animation:orbit 28s linear infinite;
    }

    .scene{
      position:relative;
      width:min(92vw,1120px);
      height:min(88svh,760px);
      transform-style:preserve-3d;
      perspective:1400px;
    }

    .axis{
      position:absolute;
      left:50%;
      top:50%;
      width:1px;
      height:78%;
      transform:translate(-50%,-50%);
      background:linear-gradient(transparent,rgba(17,19,24,.15),transparent);
    }

    .axis.horizontal{
      width:82%;
      height:1px;
    }

    .core{
      position:absolute;
      left:50%;
      top:50%;
      width:min(46vw,470px);
      aspect-ratio:1.18/1;
      transform:translate(-50%,-50%) rotateX(0deg) rotateY(0deg);
      transform-style:preserve-3d;
      transition:transform .2s ease-out;
    }

    .core-shadow{
      position:absolute;
      left:50%;
      top:63%;
      width:72%;
      height:19%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(17,19,24,.16);
      filter:blur(24px);
      animation:shadowPulse 6s ease-in-out infinite;
    }

    .frame{
      position:absolute;
      inset:0;
      border:2px solid var(--ink);
      background:rgba(255,254,249,.92);
      box-shadow:
        16px 16px 0 rgba(17,19,24,.08),
        0 26px 60px rgba(17,19,24,.14);
      overflow:hidden;
      clip-path:polygon(7% 0,100% 0,100% 87%,93% 100%,0 100%,0 13%);
      animation:frameShift var(--cycle) cubic-bezier(.65,0,.35,1) infinite;
    }

    .frame::before{
      content:"";
      position:absolute;
      inset:9%;
      border:1px dashed rgba(17,19,24,.28);
    }

    .frame::after{
      content:"";
      position:absolute;
      left:-30%;
      top:48%;
      width:160%;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--blue),transparent);
      box-shadow:0 0 16px rgba(36,87,255,.42);
      opacity:0;
      animation:scan var(--cycle) ease-in-out infinite;
    }

    .wordmark{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index:6;
      pointer-events:none;
    }

    .wordmark h1{
      margin:0;
      font-size:clamp(2.2rem,7vw,6.3rem);
      line-height:.86;
      letter-spacing:-.07em;
      font-weight:900;
      text-transform:uppercase;
      transform:scaleX(.92);
    }

    .wordmark h1 span{
      display:block;
    }

    .wordmark h1 span:last-child{
      color:var(--blue);
      transform:translateX(.16em);
    }

    .panel{
      position:absolute;
      border:2px solid var(--ink);
      background:var(--white);
      box-shadow:7px 7px 0 rgba(17,19,24,.09);
      z-index:4;
      opacity:0;
    }

    .panel::before,
    .panel::after{
      content:"";
      position:absolute;
      border-radius:999px;
      background:var(--ink);
    }

    .panel::before{
      left:14%;
      top:22%;
      width:40%;
      height:7px;
    }

    .panel::after{
      left:14%;
      top:49%;
      width:66%;
      height:5px;
      background:#aeb6c2;
    }

    .p1{
      width:32%;
      height:23%;
      left:8%;
      top:10%;
      animation:panelOne var(--cycle) cubic-bezier(.2,.8,.25,1) infinite;
    }

    .p2{
      width:26%;
      height:30%;
      right:8%;
      top:12%;
      animation:panelTwo var(--cycle) cubic-bezier(.2,.8,.25,1) infinite;
    }

    .p2::before{
      width:34%;
      height:34%;
      border-radius:50%;
      background:var(--blue-soft);
      border:2px solid var(--blue);
    }

    .p3{
      width:37%;
      height:21%;
      left:9%;
      bottom:10%;
      animation:panelThree var(--cycle) cubic-bezier(.2,.8,.25,1) infinite;
    }

    .p4{
      width:31%;
      height:22%;
      right:9%;
      bottom:10%;
      animation:panelFour var(--cycle) cubic-bezier(.2,.8,.25,1) infinite;
    }

    .p4::before{
      width:18%;
      height:18%;
      border-radius:2px;
      background:var(--blue);
    }

    .track{
      position:absolute;
      border:1px dashed rgba(17,19,24,.28);
      border-radius:50%;
      pointer-events:none;
    }

    .track.one{
      width:132%;
      height:132%;
      left:-16%;
      top:-16%;
      animation:orbit 22s linear infinite;
    }

    .track.two{
      width:158%;
      height:90%;
      left:-29%;
      top:5%;
      transform:rotate(-13deg);
      border-color:rgba(36,87,255,.18);
      animation:orbitReverse 26s linear infinite;
    }

    .node{
      position:absolute;
      width:16px;
      height:16px;
      border:2px solid var(--ink);
      background:var(--white);
      z-index:7;
      box-shadow:4px 4px 0 rgba(17,19,24,.09);
    }

    .n1{left:-8%;top:12%;animation:nodeOne var(--cycle) ease-in-out infinite}
    .n2{right:-7%;top:27%;animation:nodeTwo var(--cycle) ease-in-out infinite}
    .n3{left:8%;bottom:-8%;animation:nodeThree var(--cycle) ease-in-out infinite}
    .n4{right:13%;bottom:-8%;animation:nodeFour var(--cycle) ease-in-out infinite}

    .cursor{
      position:absolute;
      z-index:12;
      width:54px;
      height:54px;
      border:2px solid var(--ink);
      border-radius:50%;
      background:var(--white);
      box-shadow:8px 8px 0 rgba(17,19,24,.12);
      animation:cursorPath var(--cycle) cubic-bezier(.65,0,.35,1) infinite;
    }

    .cursor::before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:17px;
      height:17px;
      transform:translate(-52%,-52%) rotate(45deg);
      border-right:4px solid var(--blue);
      border-bottom:4px solid var(--blue);
    }

    .cursor::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:110px;
      height:2px;
      transform-origin:left center;
      background:linear-gradient(90deg,var(--blue),transparent);
      animation:cursorGuide var(--cycle) ease-in-out infinite;
    }

    .piece{
      position:absolute;
      width:76px;
      height:52px;
      border:2px solid var(--ink);
      background:var(--blue);
      box-shadow:7px 7px 0 rgba(17,19,24,.10);
      z-index:3;
    }

    .piece.a{left:2%;top:8%;animation:pieceA var(--cycle) cubic-bezier(.65,0,.35,1) infinite}
    .piece.b{right:3%;top:12%;animation:pieceB var(--cycle) cubic-bezier(.65,0,.35,1) infinite}
    .piece.c{left:6%;bottom:9%;animation:pieceC var(--cycle) cubic-bezier(.65,0,.35,1) infinite}
    .piece.d{right:8%;bottom:7%;animation:pieceD var(--cycle) cubic-bezier(.65,0,.35,1) infinite}

    .ruler{
      position:absolute;
      left:50%;
      top:50%;
      width:64%;
      height:64%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      opacity:.32;
    }

    .ruler::before,
    .ruler::after{
      content:"";
      position:absolute;
      background:repeating-linear-gradient(
        90deg,
        var(--ink) 0 1px,
        transparent 1px 20px
      );
    }

    .ruler::before{
      left:0;
      right:0;
      top:-28px;
      height:9px;
    }

    .ruler::after{
      left:0;
      right:0;
      bottom:-28px;
      height:9px;
    }

    .pointer-light{
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      pointer-events:none;
      background:radial-gradient(circle,rgba(36,87,255,.12),transparent 68%);
      transform:translate(-50%,-50%);
      transition:left .12s linear,top .12s linear;
    }

    @keyframes panelOne{
      0%,8%{opacity:0;transform:translate(-130%,-75%) rotate(-8deg)}
      17%,66%{opacity:1;transform:translate(0,0) rotate(0)}
      76%{opacity:1;transform:translate(4%,-4%) rotate(2deg)}
      86%,100%{opacity:0;transform:translate(-115%,-65%) rotate(-8deg)}
    }

    @keyframes panelTwo{
      0%,16%{opacity:0;transform:translate(135%,-55%) rotate(9deg)}
      26%,68%{opacity:1;transform:translate(0,0) rotate(0)}
      80%{opacity:1;transform:translate(-5%,4%) rotate(-2deg)}
      90%,100%{opacity:0;transform:translate(120%,-45%) rotate(8deg)}
    }

    @keyframes panelThree{
      0%,24%{opacity:0;transform:translate(-135%,80%) rotate(7deg)}
      34%,70%{opacity:1;transform:translate(0,0) rotate(0)}
      82%{opacity:1;transform:translate(6%,-4%) rotate(-2deg)}
      92%,100%{opacity:0;transform:translate(-120%,70%) rotate(7deg)}
    }

    @keyframes panelFour{
      0%,32%{opacity:0;transform:translate(135%,85%) rotate(-8deg)}
      42%,72%{opacity:1;transform:translate(0,0) rotate(0)}
      77%{opacity:1;transform:translate(0,0) rotate(0)}
      86%{opacity:.7;transform:translate(48%,-26%) rotate(7deg)}
      95%,100%{opacity:0;transform:translate(135%,75%) rotate(-8deg)}
    }

    @keyframes cursorPath{
      0%{left:2%;top:3%}
      14%{left:27%;top:19%}
      28%{left:70%;top:17%}
      42%{left:24%;top:64%}
      56%{left:67%;top:65%}
      69%{left:79%;top:54%}
      82%{left:48%;top:39%}
      92%{left:15%;top:75%}
      100%{left:2%;top:3%}
    }

    @keyframes cursorGuide{
      0%,100%{transform:translateY(-50%) rotate(18deg)}
      25%{transform:translateY(-50%) rotate(126deg)}
      50%{transform:translateY(-50%) rotate(214deg)}
      75%{transform:translateY(-50%) rotate(308deg)}
    }

    @keyframes pieceA{
      0%,10%{transform:translate(0,0) rotate(-8deg)}
      20%,72%{transform:translate(335%,145%) rotate(0)}
      82%,100%{transform:translate(0,0) rotate(-8deg)}
    }

    @keyframes pieceB{
      0%,18%{transform:translate(0,0) rotate(7deg)}
      30%,73%{transform:translate(-300%,145%) rotate(0)}
      84%,100%{transform:translate(0,0) rotate(7deg)}
    }

    @keyframes pieceC{
      0%,28%{transform:translate(0,0) rotate(6deg)}
      40%,74%{transform:translate(315%,-150%) rotate(0)}
      86%,100%{transform:translate(0,0) rotate(6deg)}
    }

    @keyframes pieceD{
      0%,38%{transform:translate(0,0) rotate(-7deg)}
      50%,76%{transform:translate(-275%,-150%) rotate(0)}
      86%{transform:translate(-210%,-185%) rotate(9deg)}
      96%,100%{transform:translate(0,0) rotate(-7deg)}
    }

    @keyframes nodeOne{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(40px,22px)}
    }

    @keyframes nodeTwo{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(-34px,24px)}
    }

    @keyframes nodeThree{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(28px,-34px)}
    }

    @keyframes nodeFour{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(-25px,-36px)}
    }

    @keyframes scan{
      0%,57%{opacity:0;transform:translateY(-170px)}
      63%{opacity:1}
      74%{opacity:.9;transform:translateY(170px)}
      79%,100%{opacity:0;transform:translateY(170px)}
    }

    @keyframes frameShift{
      0%,100%{transform:translate(0,0) skew(0deg)}
      40%{transform:translate(0,0) skew(0deg)}
      73%{transform:translate(-3px,2px) skew(-.4deg)}
      80%{transform:translate(3px,-2px) skew(.4deg)}
      88%{transform:translate(0,0) skew(0deg)}
    }

    @keyframes breath{
      0%,100%{transform:scale(.92)}
      50%{transform:scale(1)}
    }

    @keyframes orbit{
      to{transform:rotate(360deg)}
    }

    @keyframes orbitReverse{
      from{transform:rotate(-13deg)}
      to{transform:rotate(-373deg)}
    }

    @keyframes shadowPulse{
      0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.65}
      50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}
    }

    @media(max-width:720px){
      body{background-size:28px 28px}

      .scene{
        width:100vw;
        height:100svh;
      }

      .core{
        width:78vw;
      }

      .wordmark h1{
        font-size:clamp(2.7rem,15vw,5.2rem);
      }

      .cursor{
        width:46px;
        height:46px;
      }

      .piece{
        width:54px;
        height:38px;
      }

      .experience::before{
        width:96vw;
      }

      .experience::after{
        width:82vw;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:1ms!important;
        animation-iteration-count:1!important;
      }

      .panel{
        opacity:1;
        transform:none;
      }

      .cursor::after,
      .frame::after{
        display:none;
      }
    }
  </style>
</head>

<body>
  <main class="experience" aria-label="An abstract digital structure continuously assembling around the words In Motion">
    <section class="scene" aria-hidden="true">
      <div class="axis"></div>
      <div class="axis horizontal"></div>

      <div class="piece a"></div>
      <div class="piece b"></div>
      <div class="piece c"></div>
      <div class="piece d"></div>

      <div class="core-shadow"></div>

      <div class="core">
        <div class="track one"></div>
        <div class="track two"></div>
        <div class="ruler"></div>

        <div class="frame">
          <div class="panel p1"></div>
          <div class="panel p2"></div>
          <div class="panel p3"></div>
          <div class="panel p4"></div>

          <div class="wordmark">
            <h1><span>In</span><span>Motion</span></h1>
          </div>
        </div>

        <span class="node n1"></span>
        <span class="node n2"></span>
        <span class="node n3"></span>
        <span class="node n4"></span>

        <div class="cursor"></div>
      </div>

      <div class="pointer-light"></div>
    </section>
  </main>

  <script>
    (() => {
      const core = document.querySelector(".core");
      const scene = document.querySelector(".scene");
      const light = document.querySelector(".pointer-light");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

      function move(event){
        if(reduceMotion.matches) return;

        const rect = scene.getBoundingClientRect();
        const x = Math.max(0,Math.min(rect.width,event.clientX-rect.left));
        const y = Math.max(0,Math.min(rect.height,event.clientY-rect.top));
        const nx = (x/rect.width-.5)*2;
        const ny = (y/rect.height-.5)*2;

        core.style.transform =
          `translate(-50%,-50%) rotateX(${ny*-3}deg) rotateY(${nx*4}deg)`;

        light.style.left = `${x}px`;
        light.style.top = `${y}px`;
      }

      function reset(){
        core.style.transform="translate(-50%,-50%) rotateX(0deg) rotateY(0deg)";
        light.style.left="50%";
        light.style.top="50%";
      }

      addEventListener("pointermove",move,{passive:true});
      addEventListener("pointerleave",reset,{passive:true});

      document.addEventListener("visibilitychange",()=>{
        document.getAnimations().forEach(animation=>{
          if(document.hidden) animation.pause();
          else animation.play();
        });
      });

      reset();
    })();
  </script>
</body>
</html>
